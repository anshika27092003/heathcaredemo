# Do not set [server] port here: Streamlit Community Cloud health-checks localhost:8501.
# For a different port locally, run: streamlit run app.py --server.port 8502
[server]
# Fewer filesystem watches — often faster on Windows / synced folders (e.g. OneDrive).
fileWatcherType = "none"

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
